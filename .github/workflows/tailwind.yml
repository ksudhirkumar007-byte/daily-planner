name: Build Tailwind CSS

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'src/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Minified Tailwind CSS
        run: |
          mkdir -p src vendor
          # Generate base Tailwind directives if missing
          if [ ! -f src/input.css ]; then
            echo -e "@tailwind base;\n@tailwind components;\n@tailwind utilities;" > src/input.css
          fi
          # Install Tailwind CLI explicitly to prevent the npx executable error
          npm install -g tailwindcss@3
          tailwindcss -i ./src/input.css -o ./vendor/tailwind.min.css --content "./index.html" --minify

      - name: Commit and Push Compiled CSS
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/tailwind.min.css
          if git diff --staged --quiet; then
            echo "No CSS changes to commit."
          else
            git commit -m "Auto-compiled vendor/tailwind.min.css [skip ci]"
            git push origin main
          fi
