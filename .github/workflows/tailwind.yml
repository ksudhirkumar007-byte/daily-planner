- name: Build Minified Tailwind CSS
        run: |
          mkdir -p src vendor
          # Generate input CSS directives if missing
          echo -e "@tailwind base;\n@tailwind components;\n@tailwind utilities;" > src/input.css
          # Install Tailwind CLI v3 explicitly, then build
          npm install -g tailwindcss@3
          tailwindcss -i ./src/input.css -o ./vendor/tailwind.min.css --content "./index.html" --minify
