<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Daily Flow & Tracker (Sheets Connected)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    input[type="checkbox"] { accent-color: #6366f1; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans pb-20 antialiased selection:bg-indigo-500 selection:text-white">

  <!-- Header -->
  <header class="sticky top-0 z-30 bg-slate-900/80 backdrop-blur-md border-b border-slate-800 px-4 py-3 sm:px-6">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <div>
        <h1 class="text-lg font-bold tracking-tight text-white flex items-center gap-2">
          <i data-lucide="zap" class="w-5 h-5 text-indigo-400"></i> Daily Flow
        </h1>
        <p id="currentDateDisplay" class="text-xs text-slate-400 font-medium"></p>
      </div>
      
      <!-- Sync Status Indicator & Manual Sync Button -->
      <div class="flex items-center gap-2">
        <span id="syncStatus" class="text-[11px] text-slate-400 flex items-center gap-1 font-mono">
          <span class="w-2 h-2 rounded-full bg-emerald-500"></span> Synced
        </span>
        <button onclick="fetchRemoteData()" title="Reload from Sheets" class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition">
          <i data-lucide="refresh-cw" id="syncIcon" class="w-4 h-4"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-4xl mx-auto px-4 py-6 space-y-6">

    <!-- Section 1: Live Focus Stopwatch & Logger -->
    <section class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-lg">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400 flex items-center gap-2">
          <i data-lucide="timer" class="w-4 h-4 text-indigo-400"></i> Focus Timer
        </h2>
        <span id="timerTaskTag" class="text-xs bg-slate-800 text-indigo-300 px-2.5 py-1 rounded-full font-medium">Ready</span>
      </div>

      <div class="flex flex-col sm:flex-row items-center justify-between gap-4">
        <div>
          <div id="stopwatchDisplay" class="text-4xl sm:text-5xl font-mono font-bold text-white tracking-wider">
            00:00:00
          </div>
          <input type="text" id="timerLabelInput" placeholder="What are you focusing on?" 
                 class="mt-2 bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500 w-64">
        </div>

        <div class="flex items-center gap-2">
          <button id="toggleTimerBtn" onclick="toggleTimer()" class="flex items-center gap-1.5 px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 font-semibold text-xs text-white transition active:scale-95 shadow-md">
            <i data-lucide="play" id="timerIcon" class="w-4 h-4"></i>
            <span id="timerBtnText">Start</span>
          </button>
          <button onclick="logFocusSession()" class="flex items-center gap-1.5 px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 font-medium text-xs text-slate-300 transition active:scale-95">
            <i data-lucide="check" class="w-4 h-4 text-emerald-400"></i> Log
          </button>
          <button onclick="resetTimer()" class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-400 transition">
            <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
          </button>
        </div>
      </div>
    </section>

    <!-- Grid Layout: Habits & Daily Timeblocks -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

      <!-- Section 2: Daily Habits Tracker -->
      <section class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-lg flex flex-col justify-between">
        <div>
          <div class="flex items-center justify-between mb-4">
            <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400 flex items-center gap-2">
              <i data-lucide="flame" class="w-4 h-4 text-amber-400"></i> Habits & Streaks
            </h2>
            <button onclick="addNewHabitPrompt()" class="text-xs text-indigo-400 hover:text-indigo-300 flex items-center gap-1 font-medium">
              <i data-lucide="plus" class="w-3.5 h-3.5"></i> Add
            </button>
          </div>

          <div id="habitList" class="space-y-2.5">
            <!-- Dynamic Habits Injected Here -->
          </div>
        </div>

        <div class="mt-4 pt-3 border-t border-slate-800/80 flex items-center justify-between text-xs text-slate-500">
          <span>Synced directly to Google Sheets</span>
          <span id="habitsCompletedCounter">0/0</span>
        </div>
      </section>

      <!-- Section 3: Daily Time-Blocking Planner -->
      <section class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-lg">
        <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400 flex items-center gap-2 mb-4">
          <i data-lucide="calendar" class="w-4 h-4 text-cyan-400"></i> Daily Timeblocks
        </h2>
        
        <div class="space-y-3">
          <!-- Morning -->
          <div class="bg-slate-950 p-3 rounded-xl border border-slate-800/80">
            <span class="text-[11px] font-semibold uppercase tracking-wider text-cyan-400 flex items-center gap-1.5 mb-1.5">
              <i data-lucide="sun" class="w-3.5 h-3.5"></i> Morning (06:00 - 12:00)
            </span>
            <input type="text" id="plan_morning" onblur="handlePlannerChange()" placeholder="Workouts, morning routine..."
                   class="w-full bg-transparent text-xs text-slate-200 placeholder-slate-600 focus:outline-none">
          </div>

          <!-- Afternoon -->
          <div class="bg-slate-950 p-3 rounded-xl border border-slate-800/80">
            <span class="text-[11px] font-semibold uppercase tracking-wider text-amber-400 flex items-center gap-1.5 mb-1.5">
              <i data-lucide="sun-medium" class="w-3.5 h-3.5"></i> Afternoon (12:00 - 17:00)
            </span>
            <input type="text" id="plan_afternoon" onblur="handlePlannerChange()" placeholder="Work blocks, desk focus..."
                   class="w-full bg-transparent text-xs text-slate-200 placeholder-slate-600 focus:outline-none">
          </div>

          <!-- Evening / Night -->
          <div class="bg-slate-950 p-3 rounded-xl border border-slate-800/80">
            <span class="text-[11px] font-semibold uppercase tracking-wider text-indigo-400 flex items-center gap-1.5 mb-1.5">
              <i data-lucide="moon" class="w-3.5 h-3.5"></i> Evening (17:00 - 22:00)
            </span>
            <input type="text" id="plan_evening" onblur="handlePlannerChange()" placeholder="Family, reading, wind down..."
                   class="w-full bg-transparent text-xs text-slate-200 placeholder-slate-600 focus:outline-none">
          </div>
        </div>
      </section>

    </div>

    <!-- Section 4: Daily Tasks with Priority -->
    <section class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-lg">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400 flex items-center gap-2">
          <i data-lucide="check-square" class="w-4 h-4 text-emerald-400"></i> Priority Tasks
        </h2>
      </div>

      <!-- Add Task Form -->
      <form onsubmit="handleAddTask(event)" class="flex flex-col sm:flex-row gap-2 mb-4">
        <input type="text" id="taskTitleInput" placeholder="Add a new task..." required
               class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500">
        
        <select id="taskPriorityInput" class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-300 focus:outline-none">
          <option value="High">High</option>
          <option value="Med" selected>Medium</option>
          <option value="Low">Low</option>
        </select>

        <button type="submit" class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-xs font-semibold text-white transition active:scale-95 flex items-center justify-center gap-1">
          <i data-lucide="plus" class="w-4 h-4"></i> Add Task
        </button>
      </form>

      <!-- Task Items List -->
      <div id="taskList" class="space-y-2"></div>
    </section>

    <!-- Section 5: Today's Focus History Log -->
    <section class="bg-slate-900/60 border border-slate-800/80 rounded-2xl p-4">
      <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-400 flex items-center justify-between mb-2">
        <span>Logged Time Sessions</span>
        <button onclick="clearTimeLogs()" class="text-[11px] text-red-400 hover:underline">Clear</button>
      </h2>
      <div id="timeLogList" class="space-y-1.5 text-xs text-slate-300 font-mono"></div>
    </section>

  </main>

  <script>
    // ==========================================
    // PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL HERE:
    // ==========================================
    const API_URL = "https://script.google.com/macros/s/AKfycbyIUbopelrBb-HQoNjm3Xa9x_5ulYHdcU1N7jIJJ-wqiS0CQ6PU8gt2l9pHoxbowrz3/exec";

    const getTodayKey = () => new Date().toISOString().split('T')[0];

    // Local state fallback & fast caching
    let appData = JSON.parse(localStorage.getItem('daily_flow_cache')) || {
      habits: [
        { id: 1, name: "Workout", streak: 0, lastDone: "" },
        { id: 2, name: "Hydration", streak: 0, lastDone: "" }
      ],
      planner: { date: getTodayKey(), morning: "", afternoon: "", evening: "" },
      tasks: [],
      focusLogs: []
    };

    function setSyncStatus(state) {
      const el = document.getElementById('syncStatus');
      const icon = document.getElementById('syncIcon');
      if (state === 'syncing') {
        el.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span> Syncing...`;
        icon.classList.add('animate-spin');
      } else if (state === 'error') {
        el.innerHTML = `<span class="w-2 h-2 rounded-full bg-rose-500"></span> Offline / Err`;
        icon.classList.remove('animate-spin');
      } else {
        el.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500"></span> Synced`;
        icon.classList.remove('animate-spin');
      }
    }

    // Push local state to Google Sheets
    async function syncToRemote() {
      localStorage.setItem('daily_flow_cache', JSON.stringify(appData));
      if (!API_URL || API_URL.includes("YOUR_GOOGLE_APPS_SCRIPT")) return;

      setSyncStatus('syncing');
      try {
        await fetch(API_URL, {
          method: "POST",
          mode: "no-cors", // Google Web Apps redirect handling
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            action: "syncAll",
            data: appData
          })
        });
        setSyncStatus('synced');
      } catch (e) {
        console.error("Sync error:", e);
        setSyncStatus('error');
      }
    }

    // Pull latest data from Google Sheets
    async function fetchRemoteData() {
      if (!API_URL || API_URL.includes("YOUR_GOOGLE_APPS_SCRIPT")) return;
      setSyncStatus('syncing');
      try {
        const res = await fetch(API_URL);
        const data = await res.json();
        
        if (data.habits) appData.habits = data.habits.map(h => ({ ...h, id: Number(h.id), streak: Number(h.streak) }));
        if (data.tasks) appData.tasks = data.tasks.map(t => ({ ...t, id: Number(t.id), completed: String(t.completed) === 'true' }));
        if (data.focusLogs) appData.focusLogs = data.focusLogs;
        
        const today = getTodayKey();
        const todayPlan = data.planner ? data.planner.find(p => String(p.date).split('T')[0] === today) : null;
        appData.planner = todayPlan ? todayPlan : { date: today, morning: "", afternoon: "", evening: "" };

        localStorage.setItem('daily_flow_cache', JSON.stringify(appData));
        renderAll();
        setSyncStatus('synced');
      } catch (err) {
        console.error("Fetch error:", err);
        setSyncStatus('error');
      }
    }

    // ---------- UI Renders ----------
    function renderHeaderDate() {
      const today = new Date();
      document.getElementById('currentDateDisplay').textContent = today.toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric', year: 'numeric' });
    }

    function renderHabits() {
      const container = document.getElementById('habitList');
      container.innerHTML = '';
      const today = getTodayKey();
      let done = 0;

      appData.habits.forEach(h => {
        const isDone = h.lastDone === today;
        if (isDone) done++;
        const div = document.createElement('div');
        div.className = "flex items-center justify-between p-2.5 rounded-xl bg-slate-950 border border-slate-800/80";
        div.innerHTML = `
          <div class="flex items-center gap-3">
            <input type="checkbox" ${isDone ? 'checked' : ''} onchange="toggleHabit(${h.id})" class="w-4 h-4 rounded cursor-pointer">
            <span class="text-xs font-medium ${isDone ? 'line-through text-slate-500' : 'text-slate-200'}">${h.name}</span>
          </div>
          <div class="flex items-center gap-2">
            <span class="text-[11px] font-mono font-medium px-2 py-0.5 rounded-full ${h.streak > 0 ? 'bg-amber-950/60 text-amber-400 border border-amber-800/40' : 'text-slate-500'}">
              🔥 ${h.streak}d
            </span>
            <button onclick="removeHabit(${h.id})" class="text-slate-600 hover:text-red-400 p-1"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
          </div>
        `;
        container.appendChild(div);
      });
      document.getElementById('habitsCompletedCounter').textContent = `${done}/${appData.habits.length}`;
      lucide.createIcons();
    }

    function toggleHabit(id) {
      const today = getTodayKey();
      const habit = appData.habits.find(h => h.id === id);
      if (!habit) return;
      if (habit.lastDone === today) {
        habit.lastDone = "";
        habit.streak = Math.max(0, habit.streak - 1);
      } else {
        habit.lastDone = today;
        habit.streak += 1;
      }
      renderHabits();
      syncToRemote();
    }

    function addNewHabitPrompt() {
      const name = prompt("Enter new habit:");
      if (name && name.trim()) {
        appData.habits.push({ id: Date.now(), name: name.trim(), streak: 0, lastDone: "" });
        renderHabits();
        syncToRemote();
      }
    }

    function removeHabit(id) {
      appData.habits = appData.habits.filter(h => h.id !== id);
      renderHabits();
      syncToRemote();
    }

    function renderPlanner() {
      document.getElementById('plan_morning').value = appData.planner.morning || "";
      document.getElementById('plan_afternoon').value = appData.planner.afternoon || "";
      document.getElementById('plan_evening').value = appData.planner.evening || "";
    }

    function handlePlannerChange() {
      appData.planner = {
        date: getTodayKey(),
        morning: document.getElementById('plan_morning').value,
        afternoon: document.getElementById('plan_afternoon').value,
        evening: document.getElementById('plan_evening').value
      };
      syncToRemote();
    }

    function renderTasks() {
      const container = document.getElementById('taskList');
      container.innerHTML = '';
      if (!appData.tasks.length) {
        container.innerHTML = `<div class="text-xs text-slate-600 text-center py-4">No tasks found.</div>`;
        return;
      }
      appData.tasks.forEach(t => {
        const priorityColors = {
          High: 'text-rose-400 bg-rose-950/40 border-rose-800/40',
          Med: 'text-amber-400 bg-amber-950/40 border-amber-800/40',
          Low: 'text-slate-400 bg-slate-800 border-slate-700'
        };
        const div = document.createElement('div');
        div.className = `flex items-center justify-between p-3 rounded-xl bg-slate-950 border border-slate-800 ${t.completed ? 'opacity-50' : ''}`;
        div.innerHTML = `
          <div class="flex items-center gap-3">
            <input type="checkbox" ${t.completed ? 'checked' : ''} onchange="toggleTask(${t.id})" class="w-4 h-4 rounded cursor-pointer">
            <span class="text-xs font-medium ${t.completed ? 'line-through text-slate-500' : 'text-slate-200'}">${t.title}</span>
            <span class="text-[10px] font-semibold px-2 py-0.5 rounded border ${priorityColors[t.priority] || priorityColors.Med}">${t.priority}</span>
          </div>
          <button onclick="deleteTask(${t.id})" class="text-slate-600 hover:text-rose-400 p-1"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
        `;
        container.appendChild(div);
      });
      lucide.createIcons();
    }

    function handleAddTask(e) {
      e.preventDefault();
      const titleInput = document.getElementById('taskTitleInput');
      const priorityInput = document.getElementById('taskPriorityInput');
      appData.tasks.unshift({
        id: Date.now(),
        title: titleInput.value.trim(),
        priority: priorityInput.value,
        completed: false
      });
      titleInput.value = '';
      renderTasks();
      syncToRemote();
    }

    function toggleTask(id) {
      const t = appData.tasks.find(x => x.id === id);
      if (t) {
        t.completed = !t.completed;
        renderTasks();
        syncToRemote();
      }
    }

    function deleteTask(id) {
      appData.tasks = appData.tasks.filter(x => x.id !== id);
      renderTasks();
      syncToRemote();
    }

    // ---------- Focus Stopwatch ----------
    let timerInterval = null, timerSeconds = 0, isRunning = false;
    function formatTime(s) {
      const h = String(Math.floor(s / 3600)).padStart(2, '0');
      const m = String(Math.floor((s % 3600) / 60)).padStart(2, '0');
      const sec = String(s % 60).padStart(2, '0');
      return `${h}:${m}:${sec}`;
    }

    function toggleTimer() {
      const btn = document.getElementById('toggleTimerBtn');
      const btnText = document.getElementById('timerBtnText');
      if (!isRunning) {
        isRunning = true;
        btnText.textContent = "Pause";
        btn.classList.replace('bg-indigo-600', 'bg-amber-600');
        timerInterval = setInterval(() => {
          timerSeconds++;
          document.getElementById('stopwatchDisplay').textContent = formatTime(timerSeconds);
        }, 1000);
      } else {
        isRunning = false;
        clearInterval(timerInterval);
        btnText.textContent = "Resume";
        btn.classList.replace('bg-amber-600', 'bg-indigo-600');
      }
    }

    function resetTimer() {
      isRunning = false;
      clearInterval(timerInterval);
      timerSeconds = 0;
      document.getElementById('stopwatchDisplay').textContent = "00:00:00";
      document.getElementById('timerBtnText').textContent = "Start";
      document.getElementById('toggleTimerBtn').classList.replace('bg-amber-600', 'bg-indigo-600');
    }

    function logFocusSession() {
      if (timerSeconds < 5) return alert("Focus at least 5s before logging");
      const label = document.getElementById('timerLabelInput').value.trim() || "Deep Work";
      const duration = formatTime(timerSeconds);
      const timestamp = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      appData.focusLogs.unshift({ id: Date.now(), label, duration, timestamp });
      resetTimer();
      document.getElementById('timerLabelInput').value = "";
      renderFocusLogs();
      syncToRemote();
    }

    function renderFocusLogs() {
      const container = document.getElementById('timeLogList');
      container.innerHTML = '';
      if (!appData.focusLogs.length) {
        container.innerHTML = `<span class="text-slate-600">No sessions recorded yet.</span>`;
        return;
      }
      appData.focusLogs.slice(0, 5).forEach(l => {
        const div = document.createElement('div');
        div.className = "flex items-center justify-between bg-slate-950 p-2 rounded-lg border border-slate-800/60";
        div.innerHTML = `
          <span>${l.label}</span>
          <span class="text-indigo-400 font-bold">${l.duration} <span class="text-slate-500 font-normal">(${l.timestamp || ''})</span></span>
        `;
        container.appendChild(div);
      });
    }

    function clearTimeLogs() {
      appData.focusLogs = [];
      renderFocusLogs();
      syncToRemote();
    }

    function renderAll() {
      renderHeaderDate();
      renderHabits();
      renderPlanner();
      renderTasks();
      renderFocusLogs();
      lucide.createIcons();
    }

    window.onload = () => {
      renderAll();
      fetchRemoteData(); // initial fetch from Google Sheet
    };
  </script>
</body>
</html>
